<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ExcelsisView Batch Print</title>
  <link rel="stylesheet" href="./batch-print.css">
</head>
<body>
  <header>
    <div>
      <h1>Batch print PDFs</h1>
      <p id="batchSummary">Loading selected documents...</p>
    </div>
    <div class="brand">ExcelsisView</div>
  </header>
  <main>
    <section class="preview-panel">
      <div class="section-heading">
        <div>
          <h2>First-document preview</h2>
          <p id="previewLabel">Loading preview...</p>
        </div>
        <span id="previewPageCount"></span>
      </div>
      <div class="preview-stage">
        <div id="previewSheet" class="preview-sheet">
          <div id="previewContent" class="preview-content">
            <canvas id="previewCanvas"></canvas>
          </div>
        </div>
      </div>
      <p class="preview-note">
        These settings apply to every selected PDF. Only the first document is previewed so the batch remains one operation.
      </p>
    </section>
    <section class="settings-panel">
      <h2>Print settings</h2>
      <div class="settings-grid">
        <label class="wide">
          <span>Printer</span>
          <select id="printer"></select>
        </label>
        <label>
          <span>Paper</span>
          <select id="paperSize">
            <option value="A3">A3</option>
            <option value="A4">A4</option>
            <option value="A5">A5</option>
            <option value="Letter">Letter</option>
            <option value="Legal">Legal</option>
          </select>
        </label>
        <label>
          <span>Orientation</span>
          <select id="orientation">
            <option value="auto">Auto per document</option>
            <option value="portrait">Portrait</option>
            <option value="landscape">Landscape</option>
          </select>
        </label>
        <label>
          <span>Margins</span>
          <select id="margins">
            <option value="none">None</option>
            <option value="minimum">Minimum</option>
            <option value="normal">Normal</option>
          </select>
        </label>
        <label>
          <span>Scale</span>
          <select id="scaleMode">
            <option value="fit">Fit to printable area</option>
            <option value="actual">Actual size</option>
            <option value="custom">Custom</option>
          </select>
        </label>
        <label id="customScaleLabel">
          <span>Custom scale (%)</span>
          <input id="customScale" type="number" min="10" max="200" step="1" value="100">
        </label>
        <label>
          <span>Copies per PDF</span>
          <input id="copies" type="number" min="1" max="99" step="1" value="1">
        </label>
        <label>
          <span>Color</span>
          <select id="color">
            <option value="color">Color</option>
            <option value="grayscale">Grayscale</option>
          </select>
        </label>
        <label>
          <span>Two-sided</span>
          <select id="duplexMode">
            <option value="simplex">One-sided</option>
            <option value="longEdge">Flip on long edge</option>
            <option value="shortEdge">Flip on short edge</option>
          </select>
        </label>
        <label class="wide">
          <span>Pages in each PDF</span>
          <input id="pageRanges" type="text" value="all" maxlength="200" placeholder="all or 1-3,5">
        </label>
      </div>
      <div id="status" class="status" aria-live="polite">Preparing preview...</div>
      <progress id="progress" max="100" value="0"></progress>
      <div class="actions">
        <button id="closeBtn" type="button">Close</button>
        <button id="printBtn" class="primary" type="button" disabled>Print batch</button>
      </div>
    </section>
  </main>
  <script type="module" src="./batch-print.mjs"></script>
</body>
</html>
